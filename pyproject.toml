[project]
name = "sociyx"
version = "0.1.0"
description = "Local-first bulk cleanup of your own social media history"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "cryptography>=43",
    "playwright>=1.48",
    "textual>=8.2.8",
]

[project.scripts]
sociyx = "sociyx.cli:main"

[project.optional-dependencies]
instagram = [
    "instagrapi>=3.2.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sociyx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real public platform endpoints (read-only); skipped unless SOCIYX_LIVE_TESTS=1",
]
