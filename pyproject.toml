[project]
name = "sociyx"
version = "0.0.1"
description = "Local-first bulk cleanup of your own social media history"
readme = "README.md"
license = "MIT"
authors = [{ name = "amanverasia" }]
keywords = ["social-media", "privacy", "cleanup", "delete", "bluesky", "mastodon", "instagram", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "cryptography>=43",
    "playwright>=1.48",
    "textual>=8.2.8",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]

[project.urls]
Homepage = "https://sociyx.com/"
Repository = "https://github.com/amanverasia/sociyx"
Issues = "https://github.com/amanverasia/sociyx/issues"
Documentation = "https://github.com/amanverasia/sociyx/tree/main/docs"

[project.scripts]
sociyx = "sociyx.cli:main"

[project.optional-dependencies]
instagram = [
    "instagrapi>=3.2.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["website/"]

[tool.hatch.build.targets.wheel]
packages = ["src/sociyx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real public platform endpoints (read-only); skipped unless SOCIYX_LIVE_TESTS=1",
]
